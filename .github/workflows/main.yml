name: Treo Tool JS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # Lấy source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài Node.js (bản ổn định)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cài dependencies
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi
          npm install colors gradient-string uuid

      # Kiểm tra file tồn tại (debug nếu lỗi)
      - name: Check files
        run: |
          echo "Danh sách file:"
          ls -la

      # Chạy tool (không crash workflow nếu lỗi)
      - name: Run Tool
        run: |
          node cf-pro.js bypass 300 90 proxy.txt 100 https://rate-limit-1.dstatbot.win/aIUYZUxT || echo "Tool bị lỗi (exit code 1)"
